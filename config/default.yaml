# Configuration locale du pipeline BestShotAI V2.
personal_pipeline:
  presampling:
    analysis_fps: 8
    bucket_seconds: 1.0
    keep_per_bucket: 2
    analysis_max_width: 640

embedding_model:
  # Le téléchargement des poids est explicite ; les inférences sont strictement locales.
  huggingface_token_env: HUGGINGFACE_TOKEN
  repo_id: facebook/dinov2-small
  revision: main
  # À incrémenter lors de tout changement de backbone ou de poids.
  model_version: dinov2-vits14-1
  model_cache_dir: .bestshot/models/embedding/dinov2-vits14
  embedding_cache_dir: .bestshot/embeddings

dataset:
  database_path: .bestshot/dataset/bestshot.db
  # Les aperçus réduits restent hors de SQLite et sont référencés par les frames.
  preview_cache_dir: .bestshot/dataset/previews

pair_generation:
  temporal_window_seconds: 5
  max_pairs_per_group: 10
  seed: 42

personal_ranking:
  model_type: linear
  equal_loss_weight: 0.5
  learning_rate: 0.001
  epochs: 100
  weight_decay: 0.0001
  validation_ratio: 0.20
  early_stopping_patience: 10
  equality_margin: 0.05
  seed: 42
